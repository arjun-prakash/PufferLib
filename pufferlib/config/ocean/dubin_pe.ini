[base]
package = ocean
env_name = puffer_dubin_pe
policy_name = Policy
# Note: Uses discrete action space (0=left, 1=straight, 2=right)


[vec]
num_envs = 16

[env]
num_envs = 1024
# Discrete action parameters

[train]
adam_beta1 = 0.9610890980775877
adam_beta2 = 0.9999260775286266
adam_eps = 7.782906079040132e-10
anneal_lr = true
batch_size = auto
bptt_horizon = 64
checkpoint_interval = 200
clip_coef = 0.05982655642208556
ent_coef = 0.002465076521024325
gae_lambda = 0.9641173414828333
gamma = 0.997472126425902
learning_rate = 0.010933756713881205
#learning_rate = 0.005
max_grad_norm = 1.6317688647793107
max_minibatch_size = 16384
minibatch_size = 16384
prio_alpha = 0.8968873016577552
prio_beta0 = 0.8672928227817938
total_timesteps = 10_000_000
update_epochs = 1
use_rnn = false
vf_clip_coef = 0.5869845581530236
vf_coef = 2.1319065538539963
vtrace_c_clip = 2.714930379733876
vtrace_rho_clip = 3.8183814893708057

[sweep]
downsample = 0

[sweep.train.total_timesteps]
distribution = log_normal
min = 2e8
max = 4e8
mean = 2e8
scale = time

[sweep.env.turning_angle_deg]
distribution = uniform
min = 15.0
max = 90.0

[sweep.env.pursuer_velocity]
distribution = uniform  
min = 2.2
max = 4.0

[sweep.env.evader_velocity]
distribution = uniform
min = 1.5
max = 2.5
